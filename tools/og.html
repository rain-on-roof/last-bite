<!doctype html>
<meta charset="utf-8">
<title>og</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id="c" width="1200" height="630"></canvas>
<script type="module">
// Renders assets/og.png from the game's own renderer: open at 1200x630 and screenshot.
import { createScene, drawBackground, drawForeground, H } from '../src/render/scene.js';
import { createGooseAnimator, updateGoose, drawGoose } from '../src/render/goose.js';
import { drawCutIn } from '../src/render/honk.js';
import { DISPLAY_FONT } from '../src/render/fx.js';
import { INK } from '../src/render/paint.js';

const c = document.getElementById('c');
const ctx = c.getContext('2d');
const s = Math.max(630 / H, 1200 / 2400);
const ww = Math.min(2400, 1200 / s);
const scene = createScene(11, s * 2, ww);
const goose = createGooseAnimator();
for (let i = 0; i < 60; i++) updateGoose(goose, 1 / 60, { mood: 'victory', time: i / 60 });

ctx.save();
ctx.scale(s, s);
drawBackground(ctx, scene, 6);
drawGoose(ctx, goose, { x: scene.dx + 200, y: 840, scale: 1.2, time: 6 });
drawForeground(ctx, scene, 6);
ctx.restore();

drawCutIn(ctx, 1200, 630, 0.75);

function title(text, x, y, size, fill, rot) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.font = `900 ${size}px ${DISPLAY_FONT}`;
  ctx.lineJoin = 'round';
  ctx.fillStyle = INK;
  ctx.fillText(text, 0, size * 0.09);
  ctx.lineWidth = size * 0.18;
  ctx.strokeStyle = INK;
  ctx.strokeText(text, 0, 0);
  ctx.fillStyle = fill;
  ctx.fillText(text, 0, 0);
  ctx.restore();
}
title('LAST', 40, 92, 74, '#ffd23f', -0.06);
title('BITE', 44, 164, 82, '#ffffff', -0.06);

ctx.save();
ctx.translate(820, 560);
ctx.rotate(-0.03);
const pill = new Path2D();
pill.roundRect(0, 0, 340, 50, 25);
ctx.lineWidth = 8;
ctx.strokeStyle = INK;
ctx.stroke(pill);
ctx.fillStyle = '#fff8ea';
ctx.fill(pill);
ctx.fillStyle = INK;
ctx.font = `900 22px ${DISPLAY_FONT}`;
ctx.textBaseline = 'middle';
ctx.fillText("Don't get honked.", 26, 26);
ctx.restore();

ctx.fillStyle = 'rgba(255,255,255,0.85)';
ctx.font = '700 20px system-ui, sans-serif';
ctx.fillText('a game by Rain on Roof', 44, 600);
document.title = 'og-ready';
</script>
